name: Validate DevOps project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v6

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck python3-yaml jq

      - name: Check Bash scripts
        run: shellcheck scripts/*

      - name: Check required project files
        run: |
          test -s web/index.html
          test -s systemd/nginx-healthcheck.service
          test -s systemd/nginx-healthcheck.timer
          test -s systemd/monitoring-backup.service
          test -s systemd/monitoring-backup.timer
          test -x scripts/check-tls
          test -x scripts/backup-monitoring
          test -x scripts/prune-monitoring-backups
          test -s .github/workflows/publish-webhook-image.yml
          test -s monitoring/prometheus/prometheus.yml
          test -s monitoring/prometheus/alerts.yml
          test -s monitoring/prometheus/recording-rules.yml
          test -s monitoring/prometheus/alertmanager.yml
          test -s monitoring/prometheus/compose.yaml
          test -s monitoring/prometheus/README.md
          test -s monitoring/prometheus/grafana/dashboards/devops-lab-overview.json
          test -s monitoring/prometheus/grafana/dashboards/container-logs.json
          test -s monitoring/prometheus/grafana/provisioning/dashboards/provider.yml
          test -s monitoring/prometheus/grafana/provisioning/datasources/prometheus.yml
          test -s monitoring/prometheus/grafana/provisioning/datasources/loki.yml
          test -s monitoring/prometheus/grafana/provisioning/alerting/alert-rules.json
          test -s monitoring/prometheus/grafana/provisioning/alerting/contact-points.json
          test -s monitoring/prometheus/grafana/provisioning/alerting/warning-contact-point.json
          test -s monitoring/prometheus/grafana/provisioning/alerting/critical-contact-point.json
          test -s monitoring/prometheus/grafana/provisioning/alerting/notification-policies.json
          test -s monitoring/prometheus/loki/loki.yml
          test -s monitoring/prometheus/alloy/config.alloy
          test -s monitoring/prometheus/blackbox/blackbox.yml
          test -s monitoring/prometheus/webhook-receiver/app.py
          test -s monitoring/prometheus/webhook-receiver/Dockerfile
          test -s monitoring/prometheus/webhook-receiver/.dockerignore

      - name: Check important configuration
        run: |
          grep -q "ExecStart=" systemd/nginx-healthcheck.service
          grep -q "OnUnitActiveSec=" systemd/nginx-healthcheck.timer
          grep -q "<h1>" web/index.html
          grep -Fq 'image: ${WEBHOOK_IMAGE:-ghcr.io/pzhendov/webhook-receiver:v0.1.1}' monitoring/prometheus/compose.yaml
          grep -q "job_name: loki" monitoring/prometheus/prometheus.yml
          grep -q "job_name: alloy" monitoring/prometheus/prometheus.yml
          grep -q "alert: LokiUnavailable" monitoring/prometheus/alerts.yml
          grep -q "alert: LokiDegraded" monitoring/prometheus/alerts.yml
          grep -q "alert: AlloyUnavailable" monitoring/prometheus/alerts.yml
          grep -q "job_name: blackbox-http" monitoring/prometheus/prometheus.yml
          grep -q "alert: EndpointProbeFailed" monitoring/prometheus/alerts.yml

      - name: Validate monitoring backup systemd units
        run: |
          sudo install --directory \
            /home/ubuntu/bin

          sudo install --mode=0755 \
            scripts/backup-monitoring \
            /home/ubuntu/bin/backup-monitoring

          sudo install --mode=0755 \
            scripts/prune-monitoring-backups \
            /home/ubuntu/bin/prune-monitoring-backups

          systemd-analyze verify \
            systemd/monitoring-backup.service \
            systemd/monitoring-backup.timer

      - name: Validate Docker Compose configuration
        run: docker compose --file docker/nginx/compose.yaml config

      - name: Build Nginx Docker image
        run: docker build --tag pavel-nginx:ci docker/nginx

      - name: Start Nginx test container
        run: |
          docker run \
            --detach \
            --name nginx-ci \
            --publish 8080:80 \
            pavel-nginx:ci

      - name: Test Nginx container
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:8080 |
              grep --quiet "Image version"; then
              echo "Container test passed"
              exit 0
            fi

            echo "Waiting for Nginx: attempt $attempt"
            sleep 1
          done

          docker logs nginx-ci
          exit 1

      - name: Remove Nginx test container
        if: always()
        run: docker rm --force nginx-ci

      - name: Check visitor counter Python syntax
        run: |
          python3 -m py_compile docker/visitor-counter/app.py

      - name: Validate visitor counter Compose configuration
        run: |
          docker compose \
            --file docker/visitor-counter/compose.yaml \
            config

      - name: Start visitor counter project
        run: |
          docker compose \
            --file docker/visitor-counter/compose.yaml \
            up --detach --build

      - name: Test visitor counter project
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8081/health |
              grep --quiet '"status":"healthy"'; then
              curl --fail --silent http://localhost:8081 |
                grep --quiet "Page visits"

              echo "Visitor counter test passed"
              exit 0
            fi

            echo "Waiting for visitor counter: attempt $attempt"
            sleep 2
          done

          docker compose \
            --file docker/visitor-counter/compose.yaml \
            logs

          exit 1

      - name: Remove visitor counter project
        if: always()
        run: |
          docker compose \
            --file docker/visitor-counter/compose.yaml \
            down --volumes

      - name: Validate monitoring Compose configuration
        run: |
          docker compose \
            --file monitoring/prometheus/compose.yaml \
            config --quiet

      - name: Validate webhook receiver Python
        run: |
          python3 -m py_compile \
            monitoring/prometheus/webhook-receiver/app.py

      - name: Build webhook receiver image
        run: |
          docker build \
            --build-arg APP_VERSION=ci \
            --tag webhook-receiver:ci \
            monitoring/prometheus/webhook-receiver

      - name: Test webhook receiver persistence
        run: |
          docker volume create webhook-history-ci

          docker run \
            --detach \
            --name webhook-receiver-ci \
            --publish 127.0.0.1:18080:8080 \
            --mount source=webhook-history-ci,target=/data \
            webhook-receiver:ci

          for attempt in {1..10}; do
            if curl --fail --silent \
              http://127.0.0.1:18080/health |
              grep --quiet '"status": "healthy"'; then
              echo "Webhook receiver health check passed"
              break
            fi

            echo "Waiting for webhook receiver: attempt $attempt"
            sleep 1
          done

          curl --fail --silent \
            http://127.0.0.1:18080/health \
            >/dev/null

          curl --fail --silent \
            http://127.0.0.1:18080/version |
            jq -e '.version == "ci"' \
            >/dev/null

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"status":"firing","commonLabels":{"alertname":"CITest"}}' \
            http://127.0.0.1:18080/alerts |
            jq -e '.status == "received"' \
            >/dev/null

          curl --fail --silent \
            http://127.0.0.1:18080/alerts |
            jq -e '
              (.count == 1)
              and (.notifications[-1].status == "firing")
            ' >/dev/null

          docker rm --force webhook-receiver-ci

          docker run \
            --detach \
            --name webhook-receiver-ci \
            --publish 127.0.0.1:18080:8080 \
            --mount source=webhook-history-ci,target=/data \
            webhook-receiver:ci

          for attempt in {1..10}; do
            if curl --fail --silent \
              http://127.0.0.1:18080/alerts |
              jq -e '
                (.count == 1)
                and (.notifications[-1].status == "firing")
              ' >/dev/null; then
              echo "Webhook history survived container recreation"
              exit 0
            fi

            echo "Waiting for recreated receiver: attempt $attempt"
            sleep 1
          done

          docker logs webhook-receiver-ci
          exit 1

      - name: Remove webhook receiver test resources
        if: always()
        run: |
          docker rm --force webhook-receiver-ci 2>/dev/null || true
          docker volume rm webhook-history-ci 2>/dev/null || true

      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            --mount type=bind,source="$PWD/monitoring/prometheus/prometheus.yml",target=/etc/prometheus/prometheus.yml,readonly \
            --mount type=bind,source="$PWD/monitoring/prometheus/alerts.yml",target=/etc/prometheus/alerts.yml,readonly \
            --mount type=bind,source="$PWD/monitoring/prometheus/recording-rules.yml",target=/etc/prometheus/recording-rules.yml,readonly \
            prom/prometheus:v3.11.2 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate availability SLI and SLO semantics
        run: |
          python3 -c '
          from pathlib import Path
          import yaml

          recording = yaml.safe_load(
              Path(
                  "monitoring/prometheus/recording-rules.yml"
              ).read_text(encoding="utf-8")
          )

          recorded = {
              rule["record"]: rule["expr"]
              for group in recording["groups"]
              for rule in group["rules"]
          }

          required = {
              "job:sli_availability:ratio_5m",
              "job:sli_availability:ratio_15m",
              "job:sli_availability:ratio_1h",
              "instance:sli_http_availability:ratio_5m",
              "instance:sli_http_availability:ratio_1h",
              "slo:availability:target",
              "job:slo_error_budget_burn_rate:ratio_5m",
              "job:slo_error_budget_burn_rate:ratio_15m",
              "job:slo_error_budget_remaining:ratio_1h",
              "job:slo_error_budget_burn_rate:ratio_1h",
          }

          assert required == set(recorded)
          assert recorded["slo:availability:target"] == "vector(0.99)"

          alerts = yaml.safe_load(
              Path(
                  "monitoring/prometheus/alerts.yml"
              ).read_text(encoding="utf-8")
          )

          rules = {
              rule["alert"]: rule
              for group in alerts["groups"]
              for rule in group["rules"]
              if "alert" in rule
          }

          assert "AvailabilitySLOBreach" not in rules

          endpoint = rules["EndpointProbeFailed"]
          assert endpoint["expr"] == (
              "probe_success{job=\"blackbox-http\"} == 0"
          )
          assert endpoint["for"] == "1m"
          assert endpoint["labels"] == {
              "severity": "critical",
              "category": "endpoint",
          }

          fast = rules["AvailabilityErrorBudgetFastBurn"]
          assert fast["for"] == "1m"
          assert fast["labels"] == {
              "severity": "critical",
              "category": "slo",
          }
          assert "ratio_5m > 14.4" in fast["expr"]
          assert "ratio_15m > 14.4" in fast["expr"]

          slow = rules["AvailabilityErrorBudgetSlowBurn"]
          assert slow["for"] == "2m"
          assert slow["labels"] == {
              "severity": "warning",
              "category": "slo",
          }
          assert "ratio_15m > 6" in slow["expr"]
          assert "ratio_1h > 6" in slow["expr"]

          print("Valid multi-window availability SLI and SLO semantics")
          '

      - name: Validate Alertmanager configuration
        run: |
          docker run --rm \
            --entrypoint amtool \
            --mount type=bind,source="$PWD/monitoring/prometheus/alertmanager.yml",target=/etc/alertmanager/alertmanager.yml,readonly \
            prom/alertmanager:v0.32.1 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate Alertmanager inhibition semantics
        run: |
          python3 -c '
          from pathlib import Path
          import yaml

          config = yaml.safe_load(
              Path(
                  "monitoring/prometheus/alertmanager.yml"
              ).read_text(encoding="utf-8")
          )

          rules = config.get("inhibit_rules", [])
          assert len(rules) == 2

          loki = next(
              rule
              for rule in rules
              if "alertname=\"LokiUnavailable\""
              in rule["source_matchers"]
          )
          assert loki["source_matchers"] == [
              "alertname=\"LokiUnavailable\"",
              "severity=\"critical\"",
          ]
          assert loki["target_matchers"] == [
              "alertname=\"LokiDegraded\"",
              "severity=\"warning\"",
          ]
          assert loki["equal"] == ["job", "instance"]

          slo = next(
              rule
              for rule in rules
              if "alertname=\"AvailabilityErrorBudgetFastBurn\""
              in rule["source_matchers"]
          )
          assert slo["source_matchers"] == [
              "alertname=\"AvailabilityErrorBudgetFastBurn\"",
              "severity=\"critical\"",
              "category=\"slo\"",
          ]
          assert slo["target_matchers"] == [
              "severity=\"warning\"",
              "category=\"slo\"",
          ]
          assert slo["equal"] == ["job"]

          print("Valid Alertmanager inhibition semantics")
          '

      - name: Validate Loki configuration
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD/monitoring/prometheus/loki/loki.yml",target=/etc/loki/loki.yml,readonly \
            grafana/loki:3.7.2 \
            -config.file=/etc/loki/loki.yml \
            -verify-config=true

      - name: Validate Alloy configuration
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD/monitoring/prometheus/alloy/config.alloy",target=/etc/alloy/config.alloy,readonly \
            grafana/alloy:v1.18.0 \
            validate /etc/alloy/config.alloy

      - name: Validate Blackbox Exporter configuration
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD/monitoring/prometheus/blackbox/blackbox.yml",target=/config/blackbox.yml,readonly \
            prom/blackbox-exporter:v0.28.0 \
            --config.file=/config/blackbox.yml \
            --config.check

      - name: Validate Grafana provisioning YAML
        run: |
          python3 -c '
          from pathlib import Path
          import yaml

          files = [
              "monitoring/prometheus/grafana/provisioning/dashboards/provider.yml",
              "monitoring/prometheus/grafana/provisioning/datasources/prometheus.yml",
              "monitoring/prometheus/grafana/provisioning/datasources/loki.yml",
          ]

          for filename in files:
              yaml.safe_load(Path(filename).read_text(encoding="utf-8"))
              print(f"Valid YAML: {filename}")
          '

      - name: Validate Grafana dashboard JSON
        run: |
          jq -e '
            (.uid == "devops-lab-overview")
            and (.id == null)
            and ((.panels | length) == 5)
            and (
              [.. | objects | select(.type? == "prometheus") | .uid]
              | length > 0
            )
            and (
              [.. | objects | select(.type? == "prometheus") | .uid]
              | all(. == "prometheus")
            )
          ' monitoring/prometheus/grafana/dashboards/devops-lab-overview.json \
            >/dev/null

      - name: Validate Grafana container logs dashboard JSON
        run: |
          jq -e '
            (.uid == "container-logs")
            and (.id == null)
            and ((.panels | length) == 3)
            and (
              [.templating.list[] | select(.name == "container")]
              | length == 1
            )
            and (
              [.. | objects | select(.type? == "loki") | .uid]
              | length > 0
            )
            and (
              [.. | objects | select(.type? == "loki") | .uid]
              | all(. == "loki")
            )
          ' monitoring/prometheus/grafana/dashboards/container-logs.json \
            >/dev/null

      - name: Validate Grafana alerting provisioning JSON
        run: |
          jq -e '
            (.apiVersion == 1)
            and (
              [.groups[]
                | select(
                    (.name == "logging-alerts")
                    and (.folder == "DevOps Learning")
                    and (.interval == "1m")
                  )
              ]
              | length == 1
            )
            and (
              [.groups[].rules[]
                | select(
                    (.title == "ContainerErrorLogsDetected")
                    and (.condition == "C")
                    and (.noDataState == "OK")
                    and (.execErrState == "Error")
                    and (.for == "1m")
                    and (.keepFiringFor == "1m")
                    and (.labels.severity == "warning")
                    and (.labels.category == "logging")
                    and (.notification_settings == null)
                  )
              ]
              | length == 1
            )
            and (
              [.groups[].rules[].data[]
                | select(.refId == "A")
                | .model.expr
                | contains("webhook-receiver")
              ]
              | any
            )
          ' monitoring/prometheus/grafana/provisioning/alerting/alert-rules.json \
            >/dev/null

          jq -e '
            ([.groups[].rules[]
              | select(
                  (.uid == "critical-container-logs")
                  and (.title == "CriticalContainerLogsDetected")
                  and (.condition == "C")
                  and (.noDataState == "OK")
                  and (.execErrState == "Error")
                  and (.for == "1m")
                  and (.keepFiringFor == "1m")
                  and (.labels.severity == "critical")
                  and (.labels.category == "logging")
                  and (.notification_settings == null)
                )
            ] | length == 1)
            and (
              [.groups[].rules[].data[]
                | select(.refId == "A")
                | .model.expr
                | contains("critical|fatal|panic")
              ]
              | any
            )
          ' monitoring/prometheus/grafana/provisioning/alerting/alert-rules.json \
            >/dev/null

          jq -e '
            (.apiVersion == 1)
            and (
              [.contactPoints[]
                | select(.name == "local-webhook")
                | .receivers[]
                | select(
                    (.type == "webhook")
                    and (
                      .settings.url ==
                      "http://webhook-receiver:8080/alerts"
                    )
                    and (.disableResolveMessage == false)
                  )
              ]
              | length == 1
            )
          ' monitoring/prometheus/grafana/provisioning/alerting/contact-points.json \
            >/dev/null

          jq -e '
            (.apiVersion == 1)
            and (
              [.contactPoints[]
                | select(.name == "warning-webhook")
                | .receivers[]
                | select(
                    (.type == "webhook")
                    and (
                      .settings.url ==
                      "http://webhook-receiver:8080/alerts"
                    )
                    and (.disableResolveMessage == false)
                  )
              ]
              | length == 1
            )
          ' monitoring/prometheus/grafana/provisioning/alerting/warning-contact-point.json \
            >/dev/null

          jq -e '
            (.apiVersion == 1)
            and (
              [.contactPoints[]
                | select(.name == "critical-webhook")
                | .receivers[]
                | select(
                    (.type == "webhook")
                    and (
                      .settings.url ==
                      "http://webhook-receiver:8080/alerts"
                    )
                    and (.disableResolveMessage == false)
                  )
              ]
              | length == 1
            )
          ' monitoring/prometheus/grafana/provisioning/alerting/critical-contact-point.json \
            >/dev/null

          jq -e '
            (.apiVersion == 1)
            and (
              [.policies[]
                | select(
                    (.orgId == 1)
                    and (.receiver == "local-webhook")
                    and (.group_by == ["grafana_folder", "alertname"])
                    and (.group_wait == "30s")
                    and (.group_interval == "5m")
                    and (.repeat_interval == "4h")
                  )
              ]
              | length == 1
            )
            and (
              [.policies[].routes[]
                | select(
                    (.receiver == "warning-webhook")
                    and (
                      .object_matchers ==
                      [["severity", "=", "warning"]]
                    )
                  )
              ]
              | length == 1
            )
            and (
              [.policies[].routes[]
                | select(
                    (.receiver == "critical-webhook")
                    and (
                      .object_matchers ==
                      [["severity", "=", "critical"]]
                    )
                  )
              ]
              | length == 1
            )
          ' monitoring/prometheus/grafana/provisioning/alerting/notification-policies.json \
            >/dev/null

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform
        working-directory: terraform/local-lab
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        working-directory: terraform/local-lab
        run: terraform validate

      - name: Create Terraform test plan
        working-directory: terraform/local-lab
        run: |
          terraform plan \
            -input=false \
            -lock=false \
            -out=ci.tfplan
      
      - name: Initialize Terraform multi-file lab
        working-directory: terraform/multi-file-lab
        run: terraform init -backend=false -input=false

      - name: Validate Terraform multi-file lab
        working-directory: terraform/multi-file-lab
        run: terraform validate

      - name: Plan Terraform multi-file lab
        working-directory: terraform/multi-file-lab
        run: |
          terraform plan \
            -input=false \
            -lock=false \
            -out=ci.tfplan

      - name: Initialize Terraform module lab
        working-directory: terraform/module-lab
        run: terraform init -backend=false -input=false

      - name: Validate Terraform module lab
        working-directory: terraform/module-lab
        run: terraform validate

      - name: Plan Terraform module lab
        working-directory: terraform/module-lab
        run: |
          terraform plan \
            -input=false \
            -lock=false \
            -out=ci.tfplan

      - name: Initialize Terraform Docker lab
        working-directory: terraform/docker-lab
        run: terraform init -backend=false -input=false

      - name: Validate Terraform Docker lab
        working-directory: terraform/docker-lab
        run: terraform validate

      - name: Validation completed
        run: echo "All project validation checks passed"