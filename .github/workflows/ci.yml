name: Validate DevOps project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v6

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck python3-yaml jq

      - name: Check Bash scripts
        run: shellcheck scripts/*

      - name: Check required project files
        run: |
          test -s web/index.html
          test -s systemd/nginx-healthcheck.service
          test -s systemd/nginx-healthcheck.timer
          test -s systemd/monitoring-backup.service
          test -s systemd/monitoring-backup.timer
          test -x scripts/check-tls
          test -x scripts/backup-monitoring
          test -s .github/workflows/publish-webhook-image.yml
          test -s monitoring/prometheus/prometheus.yml
          test -s monitoring/prometheus/alerts.yml
          test -s monitoring/prometheus/alertmanager.yml
          test -s monitoring/prometheus/compose.yaml
          test -s monitoring/prometheus/README.md
          test -s monitoring/prometheus/grafana/dashboards/devops-lab-overview.json
          test -s monitoring/prometheus/grafana/provisioning/dashboards/provider.yml
          test -s monitoring/prometheus/grafana/provisioning/datasources/prometheus.yml
          test -s monitoring/prometheus/webhook-receiver/app.py
          test -s monitoring/prometheus/webhook-receiver/Dockerfile
          test -s monitoring/prometheus/webhook-receiver/.dockerignore

      - name: Check important configuration
        run: |
          grep -q "ExecStart=" systemd/nginx-healthcheck.service
          grep -q "OnUnitActiveSec=" systemd/nginx-healthcheck.timer
          grep -q "<h1>" web/index.html
          grep -Fq 'image: ${WEBHOOK_IMAGE:-ghcr.io/pzhendov/webhook-receiver:v0.1.1}' monitoring/prometheus/compose.yaml

      - name: Validate monitoring backup systemd units
        run: |
          sudo install --directory \
            /home/ubuntu/bin

          sudo install --mode=0755 \
            scripts/backup-monitoring \
            /home/ubuntu/bin/backup-monitoring

          systemd-analyze verify \
            systemd/monitoring-backup.service \
            systemd/monitoring-backup.timer

      - name: Validate Docker Compose configuration
        run: docker compose --file docker/nginx/compose.yaml config

      - name: Build Nginx Docker image
        run: docker build --tag pavel-nginx:ci docker/nginx

      - name: Start Nginx test container
        run: |
          docker run \
            --detach \
            --name nginx-ci \
            --publish 8080:80 \
            pavel-nginx:ci

      - name: Test Nginx container
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:8080 |
              grep --quiet "Image version"; then
              echo "Container test passed"
              exit 0
            fi

            echo "Waiting for Nginx: attempt $attempt"
            sleep 1
          done

          docker logs nginx-ci
          exit 1

      - name: Remove Nginx test container
        if: always()
        run: docker rm --force nginx-ci

      - name: Check visitor counter Python syntax
        run: |
          python3 -m py_compile docker/visitor-counter/app.py

      - name: Validate visitor counter Compose configuration
        run: |
          docker compose \
            --file docker/visitor-counter/compose.yaml \
            config

      - name: Start visitor counter project
        run: |
          docker compose \
            --file docker/visitor-counter/compose.yaml \
            up --detach --build

      - name: Test visitor counter project
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8081/health |
              grep --quiet '"status":"healthy"'; then
              curl --fail --silent http://localhost:8081 |
                grep --quiet "Page visits"

              echo "Visitor counter test passed"
              exit 0
            fi

            echo "Waiting for visitor counter: attempt $attempt"
            sleep 2
          done

          docker compose \
            --file docker/visitor-counter/compose.yaml \
            logs

          exit 1

      - name: Remove visitor counter project
        if: always()
        run: |
          docker compose \
            --file docker/visitor-counter/compose.yaml \
            down --volumes

      - name: Validate monitoring Compose configuration
        run: |
          docker compose \
            --file monitoring/prometheus/compose.yaml \
            config --quiet

      - name: Validate webhook receiver Python
        run: |
          python3 -m py_compile \
            monitoring/prometheus/webhook-receiver/app.py

      - name: Build webhook receiver image
        run: |
          docker build \
            --build-arg APP_VERSION=ci \
            --tag webhook-receiver:ci \
            monitoring/prometheus/webhook-receiver

      - name: Test webhook receiver persistence
        run: |
          docker volume create webhook-history-ci

          docker run \
            --detach \
            --name webhook-receiver-ci \
            --publish 127.0.0.1:18080:8080 \
            --mount source=webhook-history-ci,target=/data \
            webhook-receiver:ci

          for attempt in {1..10}; do
            if curl --fail --silent \
              http://127.0.0.1:18080/health |
              grep --quiet '"status": "healthy"'; then
              echo "Webhook receiver health check passed"
              break
            fi

            echo "Waiting for webhook receiver: attempt $attempt"
            sleep 1
          done

          curl --fail --silent \
            http://127.0.0.1:18080/health \
            >/dev/null

          curl --fail --silent \
            http://127.0.0.1:18080/version |
            jq -e '.version == "ci"' \
            >/dev/null

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"status":"firing","commonLabels":{"alertname":"CITest"}}' \
            http://127.0.0.1:18080/alerts |
            jq -e '.status == "received"' \
            >/dev/null

          curl --fail --silent \
            http://127.0.0.1:18080/alerts |
            jq -e '
              (.count == 1)
              and (.notifications[-1].status == "firing")
            ' >/dev/null

          docker rm --force webhook-receiver-ci

          docker run \
            --detach \
            --name webhook-receiver-ci \
            --publish 127.0.0.1:18080:8080 \
            --mount source=webhook-history-ci,target=/data \
            webhook-receiver:ci

          for attempt in {1..10}; do
            if curl --fail --silent \
              http://127.0.0.1:18080/alerts |
              jq -e '
                (.count == 1)
                and (.notifications[-1].status == "firing")
              ' >/dev/null; then
              echo "Webhook history survived container recreation"
              exit 0
            fi

            echo "Waiting for recreated receiver: attempt $attempt"
            sleep 1
          done

          docker logs webhook-receiver-ci
          exit 1

      - name: Remove webhook receiver test resources
        if: always()
        run: |
          docker rm --force webhook-receiver-ci 2>/dev/null || true
          docker volume rm webhook-history-ci 2>/dev/null || true

      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            --mount type=bind,source="$PWD/monitoring/prometheus/prometheus.yml",target=/etc/prometheus/prometheus.yml,readonly \
            --mount type=bind,source="$PWD/monitoring/prometheus/alerts.yml",target=/etc/prometheus/alerts.yml,readonly \
            prom/prometheus:v3.11.2 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager configuration
        run: |
          docker run --rm \
            --entrypoint amtool \
            --mount type=bind,source="$PWD/monitoring/prometheus/alertmanager.yml",target=/etc/alertmanager/alertmanager.yml,readonly \
            prom/alertmanager:v0.32.1 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate Grafana provisioning YAML
        run: |
          python3 -c '
          from pathlib import Path
          import yaml

          files = [
              "monitoring/prometheus/grafana/provisioning/dashboards/provider.yml",
              "monitoring/prometheus/grafana/provisioning/datasources/prometheus.yml",
          ]

          for filename in files:
              yaml.safe_load(Path(filename).read_text(encoding="utf-8"))
              print(f"Valid YAML: {filename}")
          '

      - name: Validate Grafana dashboard JSON
        run: |
          jq -e '
            (.uid == "devops-lab-overview")
            and (.id == null)
            and ((.panels | length) == 5)
            and (
              [.. | objects | select(.type? == "prometheus") | .uid]
              | length > 0
            )
            and (
              [.. | objects | select(.type? == "prometheus") | .uid]
              | all(. == "prometheus")
            )
          ' monitoring/prometheus/grafana/dashboards/devops-lab-overview.json \
            >/dev/null

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform
        working-directory: terraform/local-lab
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        working-directory: terraform/local-lab
        run: terraform validate

      - name: Create Terraform test plan
        working-directory: terraform/local-lab
        run: |
          terraform plan \
            -input=false \
            -lock=false \
            -out=ci.tfplan
      
      - name: Initialize Terraform multi-file lab
        working-directory: terraform/multi-file-lab
        run: terraform init -backend=false -input=false

      - name: Validate Terraform multi-file lab
        working-directory: terraform/multi-file-lab
        run: terraform validate

      - name: Plan Terraform multi-file lab
        working-directory: terraform/multi-file-lab
        run: |
          terraform plan \
            -input=false \
            -lock=false \
            -out=ci.tfplan

      - name: Initialize Terraform module lab
        working-directory: terraform/module-lab
        run: terraform init -backend=false -input=false

      - name: Validate Terraform module lab
        working-directory: terraform/module-lab
        run: terraform validate

      - name: Plan Terraform module lab
        working-directory: terraform/module-lab
        run: |
          terraform plan \
            -input=false \
            -lock=false \
            -out=ci.tfplan

      - name: Initialize Terraform Docker lab
        working-directory: terraform/docker-lab
        run: terraform init -backend=false -input=false

      - name: Validate Terraform Docker lab
        working-directory: terraform/docker-lab
        run: terraform validate

      - name: Validation completed
        run: echo "All project validation checks passed"