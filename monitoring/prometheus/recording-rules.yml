groups:
  - name: service-level-indicators
    interval: 30s
    rules:
      - record: job:sli_availability:ratio_5m
        expr: avg by (job) (avg_over_time(up[5m]))

      - record: job:sli_availability:ratio_15m
        expr: avg by (job) (avg_over_time(up[15m]))

      - record: job:sli_availability:ratio_1h
        expr: avg by (job) (avg_over_time(up[1h]))

      - record: slo:availability:target
        expr: vector(0.99)

      - record: job:slo_error_budget_burn_rate:ratio_5m
        expr: >-
          (1 - job:sli_availability:ratio_5m)
          /
          (1 - scalar(slo:availability:target))

      - record: job:slo_error_budget_burn_rate:ratio_15m
        expr: >-
          (1 - job:sli_availability:ratio_15m)
          /
          (1 - scalar(slo:availability:target))

      - record: job:slo_error_budget_remaining:ratio_1h
        expr: >-
          clamp_min(
            clamp_max(
              (
                job:sli_availability:ratio_1h
                - scalar(slo:availability:target)
              )
              /
              (1 - scalar(slo:availability:target)),
              1
            ),
            0
          )

      - record: job:slo_error_budget_burn_rate:ratio_1h
        expr: >-
          (1 - job:sli_availability:ratio_1h)
          /
          (1 - scalar(slo:availability:target))
