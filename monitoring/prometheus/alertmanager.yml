global:
  resolve_timeout: 5m

route:
  receiver: local-receiver
  group_by:
    - alertname
    - job
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

inhibit_rules:
  - source_matchers:
      - alertname="LokiUnavailable"
      - severity="critical"
    target_matchers:
      - alertname="LokiDegraded"
      - severity="warning"
    equal:
      - job
      - instance

  - source_matchers:
      - alertname="AvailabilityErrorBudgetFastBurn"
      - severity="critical"
      - category="slo"
    target_matchers:
      - severity="warning"
      - category="slo"
    equal:
      - job

receivers:
  - name: local-receiver
    webhook_configs:
      - url: http://webhook-receiver:8080/alerts
        send_resolved: true