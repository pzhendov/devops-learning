global:
  resolve_timeout: 5m

route:
  receiver: local-receiver
  group_by:
    - alertname
    - job
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: local-receiver
    webhook_configs:
      - url: http://webhook-receiver:8080/alerts
        send_resolved: true
