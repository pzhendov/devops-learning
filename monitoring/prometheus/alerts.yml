groups:
  - name: target-availability
    rules:
      - alert: TargetDown
        expr: up{job!~"loki|alloy"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Prometheus target is down
          description: >-
            The {{ $labels.job }} target {{ $labels.instance }}
            has been unreachable for more than 30 seconds.

  - name: logging-pipeline
    rules:
      - alert: LokiDegraded
        expr: up{job="loki"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Loki availability is degraded
          description: >-
            Prometheus has been unable to scrape Loki at
            {{ $labels.instance }} for more than 30 seconds.

      - alert: LokiUnavailable
        expr: up{job="loki"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Loki is unavailable
          description: >-
            Prometheus has been unable to scrape Loki at
            {{ $labels.instance }} for more than one minute.

      - alert: AlloyUnavailable
        expr: up{job="alloy"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Alloy is unavailable
          description: >-
            Prometheus has been unable to scrape Alloy at
            {{ $labels.instance }} for more than one minute.

  - name: service-level-objectives
    rules:
      - alert: AvailabilityErrorBudgetFastBurn
        expr: >-
          (
            job:slo_error_budget_burn_rate:ratio_5m > 14.4
          )
          and
          (
            job:slo_error_budget_burn_rate:ratio_15m > 14.4
          )
        for: 1m
        labels:
          severity: critical
          category: slo
        annotations:
          summary: Fast availability error-budget burn for {{ $labels.job }}
          description: >-
            The {{ $labels.job }} availability error budget is burning
            rapidly across both the five-minute and fifteen-minute windows.

      - alert: AvailabilityErrorBudgetSlowBurn
        expr: >-
          (
            job:slo_error_budget_burn_rate:ratio_15m > 6
          )
          and
          (
            job:slo_error_budget_burn_rate:ratio_1h > 6
          )
        for: 2m
        labels:
          severity: warning
          category: slo
        annotations:
          summary: Sustained availability error-budget burn for {{ $labels.job }}
          description: >-
            The {{ $labels.job }} availability error budget is burning
            too quickly across both the fifteen-minute and one-hour windows.